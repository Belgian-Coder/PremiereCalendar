name: Container

on:
  workflow_dispatch:
    inputs:
      version:
        description: Container version (without v)
        required: true

permissions:
  contents: read
  packages: write

jobs:
  build-scan-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - name: Resolve immutable build metadata
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="${{ inputs.version }}"
          fi
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          build_time="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          build_id="$(printf '%s\n%s\n' "$GITHUB_SHA" "$version" | sha256sum | cut -d' ' -f1)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "tag=$image:$version" >> "$GITHUB_OUTPUT"
          echo "build_time=$build_time" >> "$GITHUB_OUTPUT"
          echo "build_id=$build_id" >> "$GITHUB_OUTPUT"
      - name: Build exact release image
        shell: bash
        run: |
          docker buildx build --load \
            --tag "${{ steps.metadata.outputs.tag }}" \
            --build-arg "VERSION=${{ steps.metadata.outputs.version }}" \
            --build-arg "SOURCE_REVISION=$GITHUB_SHA" \
            --build-arg "BUILD_ID=${{ steps.metadata.outputs.build_id }}" \
            --build-arg "BUILD_TIME_UTC=${{ steps.metadata.outputs.build_time }}" \
            .
      - name: Verify container UI assets and runtime identity
        shell: bash
        run: |
          set -euo pipefail
          image="${{ steps.metadata.outputs.tag }}"
          cid="$(docker run --detach --rm --publish 127.0.0.1::8080 \
            --env CalendarWarmup__Enabled=false \
            --env ProviderScheduler__Enabled=false \
            --env ProviderDeltaSync__Enabled=false \
            --env ImdbDataset__Enabled=false \
            --env CacheMaintenance__Enabled=false \
            "$image")"
          trap 'docker rm --force "$cid" >/dev/null 2>&1 || true' EXIT
          port="$(docker port "$cid" 8080/tcp | sed 's/.*://')"
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error "http://127.0.0.1:$port/health/ready" >/dev/null; then
              break
            fi
            if [[ "$attempt" == 60 ]]; then
              docker logs "$cid"
              exit 1
            fi
            sleep 1
          done
          test "$(docker inspect --format '{{.Config.User}}' "$cid")" = "1654"
          curl --fail --silent --show-error \
            --output /tmp/premierecalendar-blazor.web.js \
            "http://127.0.0.1:$port/_framework/blazor.web.js"
          grep --quiet 'Blazor' /tmp/premierecalendar-blazor.web.js
          curl --fail --silent --show-error \
            --output /tmp/premierecalendar-root.html \
            "http://127.0.0.1:$port/"
          grep --quiet '_framework/blazor.web.js' /tmp/premierecalendar-root.html
      - name: Scan image and fail on fixable high or critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: ${{ steps.metadata.outputs.tag }}
          format: json
          output: trivy-results.json
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: Generate CycloneDX SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: ${{ steps.metadata.outputs.tag }}
          format: cyclonedx
          output: premierecalendar-sbom.cdx.json
          exit-code: '0'
      - name: Retain scan and SBOM evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: container-security-${{ steps.metadata.outputs.version }}
          path: |
            trivy-results.json
            premierecalendar-sbom.cdx.json
          if-no-files-found: warn
      - name: Authenticate to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the scanned image
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          docker push "${{ steps.metadata.outputs.tag }}"
          digest="$(docker inspect --format '{{index .RepoDigests 0}}' "${{ steps.metadata.outputs.tag }}")"
          echo "Published $digest"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Write publication summary
        shell: bash
        run: |
          {
            echo '### PremiereCalendar container'
            echo
            echo '- Version: `${{ steps.metadata.outputs.version }}`'
            echo '- Source: `${{ github.sha }}`'
            echo '- Image: `${{ steps.publish.outputs.digest }}`'
            echo '- Scan gate: fixable HIGH/CRITICAL findings rejected before push'
          } >> "$GITHUB_STEP_SUMMARY"
