name: premierecalendar-dev

services:
  database:
    cpus: 2
    image: postgres:18.7-alpine3.24@sha256:0115267ab5a509022df9319c77be365cef335adb71556c75f60f5360ee247e71
    environment:
      POSTGRES_DB: premierecalendar
      POSTGRES_USER: premierecalendar
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      PGDATA: /var/lib/postgresql/18/docker
    # Every test case runs in parallel and creates its own database (cloned from a migrated template); give them connection headroom.
    command: ["postgres", "-c", "max_connections=300"]
    secrets:
      - postgres_password
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U premierecalendar -d premierecalendar"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "127.0.0.1:55432:5432"
    networks: [backend]

  app:
    cpus: ${PREMIERECALENDAR_CPUS:-2}
    image: premierecalendar-dev-app:latest
    build:
      context: .
      target: development
    command: ["sh", "/src/eng/run-with-sdk-cache.sh", "dotnet", "watch", "--project", "PremiereCalendar/PremiereCalendar.csproj", "run", "--no-launch-profile"]
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      AppDatabase__Provider: PostgreSql
      AppDatabase__ConnectionString: Host=database;Port=5432;Database=premierecalendar;Username=premierecalendar
      AppDatabase__PasswordFile: /run/secrets/postgres_password
      PREMIERECALENDAR_TEST_POSTGRES: Host=database;Port=5432;Database=postgres;Username=premierecalendar
      PREMIERECALENDAR_TEST_POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      CalendarWarmup__Enabled: "false"
      Urls: http://0.0.0.0:8080
      ArtifactsPath: /build
      NUGET_PACKAGES: /root/.nuget/packages
      DOTNET_CLI_HOME: /build/.sdk-cache/dotnet
      DOTNET_GENERATE_ASPNET_CERTIFICATE: "false"
      NUGET_PLUGINS_CACHE_PATH: /build/.sdk-cache/nuget-plugins
      PC_SDK_CACHE_OWNER: ${PREMIERECALENDAR_BUILD_VOLUME:?Use eng/wsl-docker.ps1 for the worktree build identity}
      NUGET_SCRATCH: /root/.nuget/packages/.scratch
      NUGET_HTTP_CACHE_PATH: /root/.nuget/packages/.http-cache
      CalendarCache__Directory: /src/PremiereCalendar/App_Data/cache/calendar
      ImageCache__Directory: /src/PremiereCalendar/App_Data/cache/images
      Telemetry__LogDirectory: /src/PremiereCalendar/App_Data/logs
    secrets:
      - postgres_password
    volumes:
      - ./:/src
      - nuget-cache:/root/.nuget/packages
      - watch-build:/build
      - app-data:/src/PremiereCalendar/App_Data
    ports:
      - "127.0.0.1:5299:8080"
    depends_on:
      database:
        condition: service_healthy
    networks: [backend]

secrets:
  postgres_password:
    file: ./.secrets/dev-postgres-password

volumes:
  # External caches are prepared by wsl-docker and survive compose down --volumes.
  nuget-cache:
    external: true
    name: ${PREMIERECALENDAR_NUGET_VOLUME:?Use eng/wsl-docker.ps1 for the project cache identity}
  watch-build:
    external: true
    name: ${PREMIERECALENDAR_BUILD_VOLUME:?Use eng/wsl-docker.ps1 for the worktree build identity}
  postgres-data:
  app-data:

networks:
  backend:
    driver: bridge
